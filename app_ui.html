<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>BeatViz — ویژوالایزر موزیک</title>
<style>
  :root { --bg:#0d1117; --panel:#161b27; --accent:#00f5d4; --accent2:#aa3cdc; --text:#e8e8f0; --dim:#8a8fa3; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',-apple-system,'Segoe UI',sans-serif; }
  body { background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:18px 28px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #222839; }
  header h1 { font-size:20px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header .badge { font-size:11px; color:var(--dim); border:1px solid #2a3040; padding:3px 10px; border-radius:99px; }
  main { flex:1; display:flex; overflow:hidden; }
  #left { width:340px; padding:22px; border-left:1px solid #222839; display:flex; flex-direction:column; gap:14px; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; background:#080a10; position:relative; }
  .drop { border:2px dashed #2a3040; border-radius:16px; padding:26px; text-align:center; cursor:pointer; transition:.2s; }
  .drop:hover,.drop.over { border-color:var(--accent); background:#0f1520; }
  .drop p { color:var(--dim); font-size:13px; margin-top:6px; }
  .drop strong { color:var(--text); }
  select { width:100%; background:var(--panel); color:var(--text); border:1px solid #2a3040; border-radius:10px; padding:10px 12px; font-size:13px; }
  label { font-size:12px; color:var(--dim); }
  .row { display:flex; gap:10px; }
  input[type=number] { width:80px; background:var(--panel); color:var(--text); border:1px solid #2a3040; border-radius:8px; padding:8px; }
  button.go { background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#04101c; font-weight:700; border:0; border-radius:12px; padding:14px; font-size:15px; cursor:pointer; }
  button.go:disabled { opacity:.4; cursor:default; }
  #prog { height:8px; background:#222839; border-radius:99px; overflow:hidden; display:none; }
  #prog > div { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s; }
  #status { font-size:12px; color:var(--dim); }
  #gallery { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:20px; align-content:start; }
  .tile { background:var(--panel); border:1px solid #232a3a; border-radius:14px; padding:14px; cursor:pointer; transition:.15s; min-height:86px; }
  .tile:hover { border-color:var(--accent); transform:translateY(-2px); }
  .tile.sel { border-color:var(--accent); box-shadow:0 0 0 2px #00f5d455; }
  .tile h3 { font-size:13px; margin-bottom:6px; direction:ltr; text-align:left; color:var(--accent); }
  .tile p { font-size:11px; color:var(--dim); line-height:1.6; }
  .grp { grid-column:1/-1; font-size:12px; color:var(--accent2); margin-top:8px; font-weight:700; }
  video { max-width:92%; max-height:92%; border-radius:12px; background:#000; }
  #hint { position:absolute; bottom:14px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>BeatViz</h1><span class="badge" id="count"></span>
  <span style="flex:1"></span>
  <span class="badge">۵۰ قالب · خروجی Full HD</span>
</header>
<main>
  <div id="left">
    <div class="drop" id="drop">
      <strong>🎵 آهنگ را بکش و رها کن</strong>
      <p>یا کلیک کن — MP3 / WAV</p>
      <input type="file" id="file" accept="audio/*" hidden>
    </div>
    <div>
      <label>قالب</label><br><br>
      <select id="lookSel"></select>
    </div>
    <div class="row">
      <div><label>مدت (ثانیه)</label><br><input type="number" id="dur" value="15" min="3" max="300"></div>
      <div><label>عرض</label><br><input type="number" id="w" value="1920"></div>
      <div><label>ارتفاع</label><br><input type="number" id="h" value="1080"></div>
    </div>
    <button class="go" id="go" disabled>✨ ساخت ویدیو</button>
    <div id="prog"><div></div></div>
    <div id="status">آهنگ را انتخاب کن</div>
  </div>
  <div id="stage"><div id="hint">قالب را از گالری انتخاب کن</div><video id="vid" controls style="display:none"></video></div>
  <div id="gallery"></div>
</main>
<script>
const $ = s => document.querySelector(s);
let look = 'beatbars', audioB64 = null, audioName = '', jobId = null, poll = null;

fetch('/api/looks').then(r=>r.json()).then(d=>{
  const g = $('#gallery'), sel = $('#lookSel');
  $('#count').textContent = d.looks.length + ' قالب';
  let lastGrp = '';
  d.looks.forEach(L => {
    if (L.group !== lastGrp) { lastGrp = L.group;
      const h = document.createElement('div'); h.className='grp'; h.textContent = L.group; g.appendChild(h);
      const og = document.createElement('optgroup'); og.label = L.group; sel.appendChild(og);
      og.dataset.grp = L.group;
    }
    const t = document.createElement('div'); t.className='tile'+(L.id===look?' sel':'');
    t.innerHTML = `<h3>${L.id}</h3><p>${L.desc}</p>`;
    t.onclick = ()=>{ document.querySelectorAll('.tile').forEach(x=>x.classList.remove('sel'));
      t.classList.add('sel'); look = L.id; sel.value = L.id; };
    g.appendChild(t);
    const o = document.createElement('option'); o.value = L.id; o.textContent = `${L.id} — ${L.desc}`;
    sel.querySelector(`optgroup[label="${L.group}"]`).appendChild(o);
  });
  sel.value = look;
});
sel_onchange = $('#lookSel').onchange = e => { look = e.target.value;
  document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('sel', x.querySelector('h3').textContent===look)); };

const drop = $('#drop');
drop.onclick = ()=>$('#file').click();
drop.ondragover = e=>{e.preventDefault(); drop.classList.add('over');};
drop.ondragleave = ()=>drop.classList.remove('over');
drop.ondrop = e=>{e.preventDefault(); drop.classList.remove('over'); loadFile(e.dataTransfer.files[0]);};
$('#file').onchange = e=>loadFile(e.target.files[0]);

function loadFile(f){ if(!f) return; audioName=f.name;
  const r=new FileReader(); r.onload=()=>{ audioB64=r.result.split(',')[1];
    $('#status').textContent = '✓ ' + f.name + ' (' + Math.round(f.size/1024) + ' KB)';
    $('#go').disabled=false; };
  r.readAsDataURL(f); }

$('#go').onclick = ()=>{
  $('#go').disabled=true; $('#prog').style.display='block'; $('#prog>div').style.width='5%';
  $('#status').textContent='در حال ارسال…';
  fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({audio_b64:audioB64, audio_name:audioName, look, duration:+$('#dur').value,
      width:+$('#w').value, height:+$('#h').value})})
  .then(r=>r.json()).then(d=>{ jobId=d.job_id; poll=setInterval(check,1200); });
};

function check(){ fetch('/api/job/'+jobId).then(r=>r.json()).then(d=>{
  $('#prog>div').style.width=(d.progress||0)+'%';
  $('#status').textContent = d.status==='done' ? '✅ آماده!' :
    d.status==='error' ? '❌ '+d.error : '⏳ ' + (d.status==='analyzing'?'تحلیل آهنگ':'رندر ') + ' ' + (d.progress||0) + '%';
  if(d.status==='done'){ clearInterval(poll); $('#go').disabled=false;
    const v=$('#vid'); v.style.display='block'; $('#hint').style.display='none';
    v.src='/video/'+d.video; v.play();
  } else if(d.status==='error'){ clearInterval(poll); $('#go').disabled=false; }
});}
</script>
</body>
</html>
